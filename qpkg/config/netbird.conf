# Netbird VPN Configuration for QNAP
# ====================================
# Read by the netbird service script at startup and by the settings page at
# /netbird/. Apply changes with:
#
#   /etc/init.d/netbird.sh restart
#
# The service always runs 'netbird down' before 'netbird up', because
# 'netbird up' returns early with "Already connected" -- without sending any
# configuration -- when the daemon is already connected. That is why editing
# this file has no effect until the service is restarted.
#
# Every value below is optional except SETUP_KEY, which is required the first
# time this peer registers.
#
# Booleans take true or false. LEAVING A BOOLEAN EMPTY MEANS "DON'T TOUCH":
# the flag is not passed to netbird at all and whatever the peer already has
# is kept. Empty is not the same as false.

##### Connection ############################################################

# REQUIRED for first registration. Obtain from your Netbird dashboard under
# Setup Keys.
SETUP_KEY=""

# Management server URL. Must include the scheme.
# Defaults to Netbird's hosted service, https://api.netbird.io:443
# Self-hosted example: https://netbird.example.com:443
#
# Use https:// unless you are certain the server speaks plain-text gRPC. A
# http:// URL pointed at a TLS-terminating proxy makes the proxy answer the
# gRPC call with a redirect, and netbird reports it as:
#   "unexpected HTTP status code received from server: 308 (Permanent
#    Redirect); malformed header: missing HTTP content-type"
MANAGEMENT_URL=""

# Admin dashboard URL. Self-hosted setups only.
ADMIN_URL=""

# Hostname this peer registers with. Empty uses the NAS system hostname.
HOSTNAME=""

# WireGuard pre-shared key. Only peers sharing the key can communicate.
PRESHARED_KEY=""

##### Logging ###############################################################

# panic, fatal, error, warn, info, debug, trace
LOG_LEVEL=""

# Path the daemon writes its log to. Default /var/log/netbird.log
LOG_FILE=""

##### SSH server ############################################################

# Run netbird's built-in SSH server on this peer, reachable from other peers.
# NOTE: netbird treats "never configured" as ENABLED, so leaving this empty on
# an existing peer keeps the server running. Set false to turn it off.
ALLOW_SERVER_SSH=""

# Allow root logins over the netbird SSH server.
ENABLE_SSH_ROOT=""

# Enable the SFTP subsystem.
ENABLE_SSH_SFTP=""

# Allow local (-L) and remote (-R) port forwarding.
ENABLE_SSH_LOCAL_PORT_FORWARDING=""
ENABLE_SSH_REMOTE_PORT_FORWARDING=""

# Disable SSH authentication entirely. Any peer that can reach this one gets a
# shell. Only sensible on a closed network.
DISABLE_SSH_AUTH=""

# SSH JWT token cache TTL in seconds. 0 disables caching.
SSH_JWT_CACHE_TTL=""

##### Network ###############################################################

# WireGuard interface name. Default wt0
INTERFACE_NAME=""

# WireGuard listening port. Default 51820
WIREGUARD_PORT=""

# MTU for the WireGuard interface.
MTU=""

# Watch for network changes and restart the connection when they happen.
NETWORK_MONITOR=""

# Stop the client connecting automatically when the daemon starts.
DISABLE_AUTO_CONNECT=""

# Comma-separated extra interfaces to ignore.
EXTRA_IFACE_BLACKLIST=""

# Upstream resolver for the netbird DNS server, e.g. 8.8.8.8:53
DNS_RESOLVER_ADDRESS=""

# Comma-separated extra DNS labels for this peer.
EXTRA_DNS_LABELS=""

# How often dynamic DNS routes are refreshed, e.g. 1m
DNS_ROUTER_INTERVAL=""

# Comma-separated external IP mappings, e.g. 1.2.3.4 or 1.2.3.4/eth0
EXTERNAL_IP_MAP=""

##### Advanced ##############################################################

# Ignore client routes received from the management service.
DISABLE_CLIENT_ROUTES=""

# Do not act as a router for server routes.
DISABLE_SERVER_ROUTES=""

# Do not let netbird configure system DNS.
DISABLE_DNS=""

# Do not let netbird modify firewall rules.
DISABLE_FIREWALL=""

# Block access to local networks when this peer is used as a router/exit node.
BLOCK_LAN_ACCESS=""

# Block all inbound connections, overriding management policies.
BLOCK_INBOUND=""

# Do not request or use an IPv6 overlay address.
DISABLE_IPV6=""

# Post-quantum key exchange (experimental), and its permissive mode which
# still accepts peers that do not speak Rosenpass.
ENABLE_ROSENPASS=""
ROSENPASS_PERMISSIVE=""

##### Escape hatch ##########################################################

# Appended verbatim to 'netbird up'. Word-split, so quoting is not preserved.
# See 'netbird up --help'.
EXTRA_ARGS=""
