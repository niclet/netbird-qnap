name: Build QPKG

on:
  push:
    branches: [main]
  schedule:
    # Check for new upstream releases daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream netbird version to build (e.g., v0.67.0). Leave empty for latest."
        required: false
        type: string
      force:
        description: "Force rebuild even if version has not changed"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-qpkg
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - uses: actions/checkout@v6

      - name: Determine target version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(curl -s https://api.github.com/repos/netbirdio/netbird/releases/latest | jq -r '.tag_name')
          fi

          echo "Upstream version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Find highest existing release for this upstream version
          LATEST=$(gh release list --json tagName --jq '.[].tagName' 2>/dev/null | grep "^${VERSION}" | sort -V | tail -1 || echo "")

          if [ -z "$LATEST" ]; then
            RELEASE_TAG="$VERSION"
          elif [ "$LATEST" = "$VERSION" ]; then
            RELEASE_TAG="${VERSION}-2"
          else
            SUFFIX=$(echo "$LATEST" | sed "s/^${VERSION}-//")
            NEXT=$((SUFFIX + 1))
            RELEASE_TAG="${VERSION}-${NEXT}"
          fi

          # Build if: first release, forced, schedule detects new version, or commit message contains [release]
          COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null || echo "")
          if [ "$FORCE" = "true" ] || [ -z "$LATEST" ] || echo "$COMMIT_MSG" | grep -qi "\[release\]"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Will build $RELEASE_TAG"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already released as $LATEST, skipping"
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Clone upstream netbird source
        run: |
          git clone --depth 1 --branch ${{ needs.check-version.outputs.version }} \
            https://github.com/netbirdio/netbird.git src

      - name: Detect Go version from upstream
        id: goversion
        run: |
          GO_VERSION=$(grep '^go ' src/go.mod | awk '{print $2}')
          echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          echo "Upstream requires Go $GO_VERSION"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache: false

      - name: Build static binaries (all QNAP arches)
        run: |
          cd src
          VERSION="${{ needs.check-version.outputs.version }}"
          VERSION_STRIPPED="${VERSION#v}"
          LDFLAGS="-s -w -X github.com/netbirdio/netbird/version.version=${VERSION_STRIPPED}"

          # QNAP arch dir : GOARCH [GOARM]. ARMv7 (arm-x31 vfpv3 / arm-x41 vfpv3+vfpv4)
          # both take the same GOARM=7 static binary; QNAP only distinguishes toolchain.
          build() {
            local dir="$1" goarch="$2" goarm="${3:-}"
            mkdir -p "../qpkg/${dir}"
            echo "Building ${dir} (GOARCH=${goarch} GOARM=${goarm:-n/a})"
            CGO_ENABLED=0 GOOS=linux GOARCH="${goarch}" GOARM="${goarm}" \
              go build -ldflags "${LDFLAGS}" -o "../qpkg/${dir}/netbird" ./client/
          }

          build x86_64 amd64
          build arm_64 arm64
          build arm-x41 arm 7
          # arm-x31 shares the ARMv7 binary
          cp ../qpkg/arm-x41/netbird ../qpkg/arm-x31/netbird

      - name: Verify binaries
        run: |
          for dir in x86_64 arm_64 arm-x41 arm-x31; do
            echo "== qpkg/${dir}/netbird =="
            file "qpkg/${dir}/netbird"
            ls -lh "qpkg/${dir}/netbird"
          done

      - name: Update QPKG version
        run: |
          RELEASE_TAG="${{ needs.check-version.outputs.release_tag }}"
          # Strip v prefix and convert dashes to dots for QNAP (0.67.1-2 -> 0.67.1.2)
          QPKG_VER=$(echo "${RELEASE_TAG#v}" | tr '-' '.')
          sed -i "s/^QPKG_VER=.*/QPKG_VER=\"${QPKG_VER}\"/" qpkg/qpkg.cfg

      - name: Generate icons from upstream logo
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p qpkg/icons
          if [ -f src/docs/media/logo.png ]; then
            convert src/docs/media/logo.png -resize 80x80 qpkg/icons/netbird_80.png
            convert src/docs/media/logo.png -resize 100x100 qpkg/icons/netbird_100.png
            convert src/docs/media/logo.png -resize 64x64 -colorspace Gray qpkg/icons/netbird_gray.png
          else
            echo "Warning: upstream logo not found, icons will be missing"
          fi

      - name: Build QPKG
        run: ./build-qpkg.sh

      - name: Collect QPKGs, stable-named copies, and checksums
        run: |
          BUILD_DIR=qpkg/build
          mapfile -t FILES < <(find "$BUILD_DIR" -name "netbird_*.qpkg" -type f | sort)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Error: No .qpkg file found in $BUILD_DIR"
            exit 1
          fi

          for f in "${FILES[@]}"; do
            base=$(basename "$f")
            case "$base" in
              *_x86_64.qpkg)  arch=x86_64  ;;
              *_arm_64.qpkg)  arch=arm_64  ;;
              *_arm-x41.qpkg) arch=arm-x41 ;;
              *_arm-x31.qpkg) arch=arm-x31 ;;
              *) echo "Error: cannot determine arch for $base"; exit 1 ;;
            esac
            cp "$f" "$BUILD_DIR/netbird_${arch}.qpkg"
            ( cd "$BUILD_DIR" \
              && sha256sum "$base" > "${base}.sha256" \
              && sha256sum "netbird_${arch}.qpkg" > "netbird_${arch}.qpkg.sha256" )
            echo "Prepared ${arch}: ${base} -> netbird_${arch}.qpkg"
          done

          echo "Release directory contents:"
          ls -lh "$BUILD_DIR"

      - name: Upload QPKG artifact
        uses: actions/upload-artifact@v5
        with:
          name: netbird-qpkg-${{ needs.check-version.outputs.version }}
          path: qpkg/build/
          retention-days: 30

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Download QPKG artifact
        uses: actions/download-artifact@v5
        with:
          name: netbird-qpkg-${{ needs.check-version.outputs.version }}
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.release_tag }}
        run: |
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true

          # Create the release WITHOUT assets first, then upload separately with
          # --clobber + retry. Attaching assets in the same `create` call races the
          # tag/release propagation and intermittently 400s from uploads.github.com.
          gh release create "$VERSION" \
            --title "Netbird QPKG $VERSION" \
            --notes "$(cat <<'EOF'
          Netbird VPN client packaged as QPKG for QNAP NAS (x86_64, arm_64, arm-x41, arm-x31).

          ## Auto-update repository
          Add this URL in QNAP App Center → App Repository:
          `https://zachhandley.github.io/netbird-qnap/repo.xml`

          ## Manual installation
          1. Download the `.qpkg` file matching your NAS architecture below
          2. In QNAP App Center, click **Install Manually**
          3. Browse to the downloaded file and install

          Unsigned package: enable App Center → Settings → General →
          "Allow installation of applications without a valid digital signature".
          EOF
          )"

          # Upload assets idempotently, retrying transient upload failures (400/5xx).
          for attempt in 1 2 3; do
            if gh release upload "$VERSION" dist/* --clobber; then
              echo "Assets uploaded on attempt ${attempt}"
              exit 0
            fi
            echo "Upload attempt ${attempt} failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "Asset upload failed after 3 attempts"
          exit 1

      - name: Update repo.xml with new version
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.release_tag }}
        run: |
          # Convert release tag to QNAP version (v0.67.1-2 -> 0.67.1.2)
          QPKG_VER=$(echo "${RELEASE_TAG#v}" | tr '-' '.')
          TIMESTAMP=$(date +%s)
          sed -i "s|<version>.*</version>|<version>${QPKG_VER}</version>|" repo.xml
          sed -i "s|<cachechk>.*</cachechk>|<cachechk>${TIMESTAMP}</cachechk>|" repo.xml

      - name: Prepare Pages artifact
        run: |
          mkdir -p _pages
          cp repo.xml _pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
